    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        color: #f8fafc;
      }

      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Animasi Modern Ala AI Core / Pulse */
      .app-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100vw;
        position: fixed;
        top: 0;
        left: 0;
        background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        z-index: 9999;
        transition: opacity 0.4s ease-out;
      }

      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      /* Lingkaran Berdenyut & Berpendar */
      .ai-orb {
        width: 70px;
        height: 70px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .ai-orb::before,
      .ai-orb::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: linear-gradient(135deg, #38bdf8, #818cf8);
        opacity: 0.6;
        animation: wavePulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .ai-orb::after {
        animation-delay: 1s;
      }

      .ai-core-dot {
        width: 24px;
        height: 24px;
        background-color: #38bdf8;
        border-radius: 50%;
        z-index: 2;
        box-shadow: 0 0 20px #38bdf8, 0 0 40px #818cf8;
        animation: coreGlow 1.5s ease-in-out infinite alternate;
      }

      .loader-brand {
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Animasi Titik-Titik Indikator Proses */
      .loader-dots {
        display: flex;
        gap: 6px;
        margin-top: -12px;
      }

      .loader-dots span {
        width: 6px;
        height: 6px;
        background-color: #38bdf8;
        border-radius: 50%;
        animation: bounceDot 1.4s infinite ease-in-out both;
      }

      .loader-dots span:nth-child(1) { animation-delay: -0.32s; }
      .loader-dots span:nth-child(2) { animation-delay: -0.16s; }

      @keyframes wavePulse {
        0% {
          transform: scale(0.5);
          opacity: 0.8;
        }
        100% {
          transform: scale(1.8);
          opacity: 0;
        }
      }

      @keyframes coreGlow {
        0% { transform: scale(0.9); box-shadow: 0 0 10px #38bdf8; }
        100% { transform: scale(1.1); box-shadow: 0 0 25px #38bdf8, 0 0 50px #818cf8; }
      }

      @keyframes bounceDot {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1.0); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <noscript>
        <div style="padding: 40px; text-align: center; background-color: #1e293b; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
          <h1 style="margin: 0 0 10px 0; color: #38bdf8;">JavaScript Diperlukan</h1>
          <p style="margin: 0; color: #94a3b8; max-width: 400px;">
            Aplikasi ChanThecno memerlukan JavaScript agar dapat berjalan dengan optimal. Harap aktifkan JavaScript di pengaturan browser Anda.
          </p>
        </div>
      </noscript>

      <!-- Preloader Animasi AI Modern -->
      <div class="app-loader" id="app-loader">
        <div class="loader-content">
          <div class="ai-orb">
            <div class="ai-core-dot"></div>
          </div>
          <div class="loader-brand">ChanThecno</div>
          <div class="loader-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
    
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const observer = new MutationObserver((mutations, obs) => {
          const rootElement = document.getElementById('root');
          if (rootElement && rootElement.children.length > 1) {
            const loader = document.getElementById('app-loader');
            if (loader) {
              loader.style.opacity = '0';
              setTimeout(() => loader.remove(), 400);
            }
            obs.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      });
    </script>
